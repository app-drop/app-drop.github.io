<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Drop – Leergut-Abholung</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drop">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Plan: Apple-Look. Weiß und Systemgrau als Fläche, ein Grün als einzige Akzentfarbe, große fette Titel, gruppierte Listen, Tab-Leiste unten. */
:root{
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --surface-2:#EEEEF2;
  --ink:#1C1C1E;
  --muted:#6C6C70;
  --line:rgba(60,60,67,.14);
  --brand:#1E9E4A;
  --brand-ink:#FFFFFF;
  --brand-soft:#E5F6EA;
  --warn:#B86E00;
  --info:#0A6CD6;
  --danger:#D70015;
  --water:#A9D3F0;
  --forest:#D6ECCB;
  --land:#F7F5F0;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#1C1C1E;--surface-2:#2C2C2E;--ink:#F2F2F7;--muted:#98989F;--line:rgba(84,84,88,.5);
    --brand:#30D158;--brand-ink:#04210E;--brand-soft:#0F2E19;--warn:#FFB340;--info:#64B0FF;--danger:#FF6961;
    --water:#1D3A52;--forest:#16301E;--land:#151517;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1C1C1E;--surface-2:#2C2C2E;--ink:#F2F2F7;--muted:#98989F;--line:rgba(84,84,88,.5);
  --brand:#30D158;--brand-ink:#04210E;--brand-soft:#0F2E19;--warn:#FFB340;--info:#64B0FF;--danger:#FF6961;
  --water:#1D3A52;--forest:#16301E;--land:#151517;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
h3{font-size:17px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
main{flex:1;padding:12px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
main.nonav{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;min-height:44px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.logo{display:flex;align-items:center;gap:10px}
.appicon{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.appicon svg{width:22px;height:22px}
.muted{color:var(--muted)}
.small{font-size:15px}
.tiny{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font-weight:600;font-size:17px;min-height:52px;background:var(--brand);color:var(--brand-ink);text-decoration:none;transition:opacity .12s,transform .08s}
.btn:active{opacity:.75;transform:scale(.99)}
.btn.block{width:100%}
.btn.white{background:#fff;color:#1E9E4A}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.outline{background:var(--surface);color:var(--ink)}
.btn.danger{background:var(--surface);color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 16px;font-size:15px;border-radius:999px}
.btn svg{width:20px;height:20px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--brand)}
.iconbtn svg{width:20px;height:20px}
.iconbtn .avatar{width:40px;height:40px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.st-offen{color:var(--brand);background:var(--brand-soft)}
.st-angenommen{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.st-abgeholt{color:var(--info);background:color-mix(in srgb,var(--info) 12%,transparent)}
.st-abgeschlossen{color:var(--muted);background:var(--surface-2)}
.value{font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;white-space:nowrap}
.getpill{display:inline-flex;align-items:center;background:var(--surface-2);color:var(--brand);font-weight:700;font-size:15px;border-radius:999px;padding:5px 14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.demo-banner{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;padding:0 4px}
.demo-banner svg{flex:none;margin-top:1px}
/* Grouped list (App-Store-Stil) */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.group>*+*{border-top:.5px solid var(--line)}
.group .lcard{border-radius:0;background:transparent}
.group .lcard+.lcard{border-top:0;box-shadow:inset 0 .5px 0 var(--line)}
.lcard{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:0;border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.lcard:active{background:var(--surface-2)}
.thumb{width:64px;height:64px;border-radius:14px;background:var(--brand-soft);overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:36px;height:36px}
.lcard .t{font-weight:600;font-size:16px;line-height:1.25;display:block}
.lcard .m{font-size:14px;color:var(--muted);margin-top:2px;display:block}
.lcard .s{margin-top:6px;display:block}
/* Hero (Heute-Karte) */
.hero{background:linear-gradient(160deg,#2DBE60 0%,#1E9E4A 55%,#17803B 100%);color:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero .eyebrow{color:rgba(255,255,255,.8)}
.hero h2{font-size:28px;line-height:1.1;letter-spacing:-.025em;padding-right:60px}
.hero p{margin:0;color:rgba(255,255,255,.9);font-size:16px}
.hero .deco{position:absolute;right:-6px;top:10px;width:96px;height:96px;opacity:.22;pointer-events:none;color:#fff}
.hero>*:not(.deco){position:relative}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px 12px}
.tile .n{font-family:var(--font-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .l{font-size:13px;color:var(--muted);line-height:1.25}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 10px;font-weight:600;font-size:14px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:0;background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:600;font-size:15px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.sect-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
.link{background:none;border:0;color:var(--brand);font-weight:400;font-size:17px;padding:0;text-decoration:none}
/* Tab bar */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 8px calc(4px + env(safe-area-inset-bottom));z-index:20}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#8E8E93;padding:4px 0;position:relative}
nav.bottom button svg{width:26px;height:26px}
nav.bottom button[aria-current="page"]{color:var(--brand)}
.badge{position:absolute;top:0;right:calc(50% - 22px);background:#FF3B30;color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* Forms */
label.f,div.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:15px}
.card .chip{background:var(--surface-2)}
.card .chip[aria-pressed="true"]{background:var(--brand)}
.input,select.input,textarea.input{width:100%;border:0;background:var(--surface-2);border-radius:10px;padding:13px 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.input:focus{box-shadow:0 0 0 2px var(--brand)}
textarea.input{min-height:84px;resize:vertical}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:.5px solid var(--line);gap:12px}
.stepper:last-child{border-bottom:0;padding-bottom:0}
.stepper:first-child{padding-top:0}
.stepper .ctl{display:flex;align-items:center;background:var(--surface-2);border-radius:9px;padding:2px}
.stepper .ctl button{width:44px;height:32px;border-radius:7px;border:0;background:transparent;font-size:22px;font-weight:400;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.stepper .ctl button:active{background:var(--surface)}
.stepper .ctl output{min-width:38px;text-align:center;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.choice button{border:0;background:var(--surface-2);border-radius:12px;padding:12px;text-align:left;font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:2px}
.choice button small{font-weight:400;color:var(--muted);font-size:13px}
.choice button[aria-pressed="true"]{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand);color:var(--ink)}
.photo-drop{border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;background:var(--surface-2);cursor:pointer}
.photo-drop svg{width:30px;height:30px;color:var(--brand);flex:none}
.photo-prev{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.sum{display:flex;justify-content:space-between;padding:5px 0;font-size:16px;gap:12px}
.sum.total{border-top:.5px solid var(--line);margin-top:6px;padding-top:11px;font-weight:600}
/* Detail */
.dhead{border-radius:22px;overflow:hidden;background:var(--brand-soft);height:200px;display:flex;align-items:center;justify-content:center}
.dhead img{width:100%;height:100%;object-fit:cover}
.dhead svg{width:96px;height:96px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:16px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.person{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff;flex:none;font-size:16px}
.avatar.lg{width:84px;height:84px;font-size:30px}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avedit{position:relative;display:inline-block;cursor:pointer;border-radius:50%}
.avedit .avatar.lg{width:96px;height:96px;font-size:34px}
.avedit .cam{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;border:3px solid var(--surface);display:flex;align-items:center;justify-content:center}
.avedit .cam svg{width:16px;height:16px}
.avedit.busy{opacity:.5;pointer-events:none}
.stars{color:#FF9500;letter-spacing:1px;white-space:nowrap}
.timeline{display:flex;gap:4px}
.timeline span{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.timeline span.on{background:var(--brand)}
.tl-labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:12px;color:var(--muted);margin-top:7px}
.tl-labels span:nth-child(2),.tl-labels span:nth-child(3){text-align:center}
.tl-labels span:last-child{text-align:right}
.maplink{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px 14px;color:var(--ink);text-decoration:none}
.maplink .mi{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#7FD38B,#3FA9F5);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.maplink .mi svg{width:22px;height:22px}
.maplink .chev{margin-left:auto;color:#C4C4C7}
/* Chat */
.msgs{flex:1;display:flex;flex-direction:column;gap:6px;padding:8px 0 110px}
.msg{max-width:78%;padding:9px 14px;border-radius:19px;font-size:16px;line-height:1.3;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.msg.them{align-self:flex-start;background:var(--surface)}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;text-align:center;padding:4px}
.msg time{display:block;font-size:11px;opacity:.65;margin-top:2px}
.composer{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:20}
.composer form{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.composer input{flex:1;border:.5px solid var(--line);border-radius:999px;padding:9px 16px;background:var(--surface);font-size:17px;outline:none}
.composer form button{width:36px;height:36px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;flex:none}
.composer form button svg{width:20px;height:20px}
.quick{display:flex;gap:6px;overflow-x:auto;max-width:560px;margin:0 auto 8px;scrollbar-width:none}
.quick button{border:0;background:var(--surface-2);border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap;color:var(--brand);font-weight:500}
.chatitem{display:flex;gap:12px;align-items:center;padding:12px 14px;background:transparent;border:0;width:100%;text-align:left}
.chatitem .p{flex:1;min-width:0}
.chatitem .p .last{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--info);flex:none}
/* Map */
.mapbox{position:relative;border-radius:var(--r);overflow:hidden;background:var(--land)}
.mapbox svg.map{display:block;width:100%;height:auto}
.map .lbl{font-family:var(--font-body);font-size:8.5px;fill:var(--muted);font-weight:600}
.map .pin{cursor:pointer}
.mapcard{position:absolute;left:10px;right:10px;bottom:10px;border-radius:var(--r);box-shadow:0 6px 24px rgba(0,0,0,.18)}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto;animation:up .22s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:#C7C7CC;align-self:center;margin-top:-10px}
.rate{display:flex;gap:6px;justify-content:center}
.rate button{border:0;background:transparent;font-size:38px;line-height:1;color:#D1D1D6;padding:4px}
.rate button.on{color:#FF9500}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--ink);padding:12px 16px;border-radius:16px;font-size:15px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.18);animation:drop .25s;display:flex;gap:10px;align-items:center}
.toast svg{color:var(--brand)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
/* Login */
.login{min-height:100%;display:flex;flex-direction:column;gap:24px;padding:36px 20px calc(28px + env(safe-area-inset-bottom));background:var(--surface)}
.login .brand{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.login .brand .mark{width:76px;height:76px;border-radius:18px;background:linear-gradient(160deg,#2DBE60,#17803B);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(30,158,74,.3)}
.login .brand .mark svg{width:46px;height:46px}
.login .brand p{margin:0;font-size:19px;color:var(--muted);max-width:30ch}
.login .input{background:var(--bg)}
.login .seg{background:var(--bg)}
.demo-acc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo-acc button{border:0;background:var(--bg);border-radius:14px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center}
.demo-acc button .avatar{width:36px;height:36px;font-size:14px}
.demo-acc button b{display:block;font-size:15px}
.demo-acc button small{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:15px;font-weight:500}
.empty{text-align:center;padding:26px 16px;color:var(--muted);background:var(--surface);border-radius:var(--r);font-size:15px}
.review{border-top:.5px solid var(--line);padding-top:12px}
.review:first-child{border-top:0;padding-top:0}
.list-h{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;padding:0 16px;margin-bottom:-14px}
.lmap{height:440px;width:100%;background:var(--surface-2)}
.dmap{height:190px;border-radius:var(--r);overflow:hidden;background:var(--surface-2);z-index:0}
.mapbox{isolation:isolate}
.leaflet-container{font-family:var(--font-body)}
.osm-tiles{filter:saturate(.75) contrast(.95) brightness(1.03)}
.leaflet-control-attribution{font-size:10px!important}
.pinwrap{background:none;border:0}
.pinb{display:inline-block;transform:translate(-50%,-50%);background:var(--brand);color:#fff;font-weight:700;font-size:13px;padding:4px 9px;border-radius:999px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap;font-variant-numeric:tabular-nums;cursor:pointer}
.pinb.w{background:var(--warn)}
.pinb.sel{transform:translate(-50%,-50%) scale(1.2);box-shadow:0 0 0 4px rgba(30,158,74,.35),0 2px 8px rgba(0,0,0,.25)}
.pinb.mini{transform:none;width:14px;height:14px;padding:0}
.medot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#0A84FF;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.locbtn{position:absolute;right:10px;bottom:24px;z-index:500;width:40px;height:40px;border-radius:10px;border:0;background:var(--surface);color:var(--info);box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}
.locbtn svg{width:22px;height:22px}

<body>
<div class="app" id="app"></div>
<div id="layer"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* ---------- Icons ---------- */
const I={
  logo:'<svg viewBox="0 0 32 32" fill="none"><path d="M13 3h6v5l3 4v15a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2V12l3-4V3z" fill="currentColor"/><path d="M12.5 17h7" stroke="var(--brand)" stroke-width="2" stroke-linecap="round"/><path d="M24 8l3-2M25 12h3M8 8L5 6M7 12H4" stroke="currentColor" opacity=".7" stroke-width="2" stroke-linecap="round"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  compass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  bottles:'<svg viewBox="0 0 48 48" fill="none"><path d="M14 6h5v6l3 5v23a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V17l3-5z" fill="var(--brand)"/><path d="M28 10h5v5l3 5v20a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V20l3-5z" fill="var(--brand)" opacity=".45"/><path d="M12 26h8M26 28h8" stroke="var(--surface)" stroke-width="2.5" stroke-linecap="round"/></svg>',
  glass:'<svg viewBox="0 0 48 48" fill="none"><path d="M10 14h28l-3 26a2 2 0 0 1-2 2H15a2 2 0 0 1-2-2z" fill="var(--brand)" opacity=".9"/><path d="M15 10h7v4h-7zM26 8h7v6h-7z" fill="var(--brand)" opacity=".45"/><path d="M17 22v12M24 22v12M31 22v12" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" opacity=".6"/></svg>',
  crate:'<svg viewBox="0 0 48 48" fill="none"><rect x="6" y="18" width="36" height="22" rx="3" fill="var(--brand)"/><path d="M12 18V8h4v10M20 18V6h4v12M28 18V8h4v10M36 18V10" stroke="var(--brand)" opacity=".5" stroke-width="3.5" stroke-linecap="round"/><path d="M14 26h20" stroke="var(--surface)" stroke-width="3" stroke-linecap="round"/></svg>',
  plusc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v9M7.5 12h9"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7z"/><path d="M9 4v13M15 7v13"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg>',
  logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/></svg>',
};

/* ---------- Constants ---------- */
const PRICES={einweg:0.25,mehrweg:0.08,kisten:1.50};
const DISTRICTS={
  "Mitte":[48.7758,9.1829],"West":[48.7745,9.1530],"Süd":[48.7580,9.1680],"Ost":[48.7850,9.2050],"Nord":[48.7960,9.1800],
  "Bad Cannstatt":[48.8050,9.2150],"Feuerbach":[48.8150,9.1550],"Zuffenhausen":[48.8330,9.1700],"Weilimdorf":[48.8150,9.1100],
  "Botnang":[48.7800,9.1250],"Vaihingen":[48.7300,9.1080],"Möhringen":[48.7250,9.1500],"Degerloch":[48.7480,9.1700],
  "Untertürkheim":[48.7800,9.2500],"Hedelfingen":[48.7600,9.2550],"Plieningen":[48.7020,9.2100],"Mühlhausen":[48.8420,9.2300]
};
const AV_COLORS=["#0B6E4F","#2364AA","#8E4CC2","#C2571A","#1F8A70","#B23A62","#5B6B12","#3D5A80"];
const STEPS=["offen","angenommen","abgeholt","abgeschlossen"];
const STEP_LABEL={offen:"Offen",angenommen:"Angenommen",abgeholt:"Abgeholt",abgeschlossen:"Erledigt"};
const STORE_KEY="klirr-demo-v1";

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>n.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const uid=p=>p+Math.random().toString(36).slice(2,9);
const now=()=>Date.now();
const MIN=60000,HOUR=3600000,DAY=86400000;
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function avatar(u,cls=""){return `<span class="avatar ${cls}" style="background:${u.color}" aria-hidden="true">${u.avatar?`<img src="${esc(u.avatar)}" alt="" loading="lazy">`:esc(initials(u.name))}</span>`}
function km(a,b){const R=6371,t=x=>x*Math.PI/180;const dLat=t(b[0]-a[0]),dLng=t(b[1]-a[1]);const h=Math.sin(dLat/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function fmtKm(d){return d<1?Math.round(d*1000/50)*50+" m":d.toLocaleString("de-DE",{maximumFractionDigits:1})+" km"}
function ago(t){const d=now()-t;if(d<MIN)return"gerade eben";if(d<HOUR)return`vor ${Math.round(d/MIN)} Min.`;if(d<DAY)return`vor ${Math.round(d/HOUR)} Std.`;const n=Math.round(d/DAY);return n===1?"gestern":`vor ${n} Tagen`}
function clock(t){return new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}
function stars(avg){const r=Math.round(avg);return "★".repeat(r)+"☆".repeat(5-r)}
function amaps(q){return "https://maps.apple.com/?q="+encodeURIComponent(q)}
function jitter(c){return [c[0]+(Math.random()-.5)*0.008,c[1]+(Math.random()-.5)*0.012]}

/* ---------- Supabase ---------- */
const SUPABASE_URL="https://tsrzmroyafbunipqmoso.supabase.co";
const SUPABASE_KEY="sb_publishable_dijc9NOC8caO9U2G1wH49Q_q2jXP5I5";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* ---------- Store (Zwischenspeicher der Daten aus Supabase) ---------- */
let S={session:null,users:{},listings:[],chats:{},lastRead:{},loaded:false};
try{S.lastRead=JSON.parse(localStorage.getItem("drop-lastread")||"{}")}catch(e){}
function saveLastRead(){try{localStorage.setItem("drop-lastread",JSON.stringify(S.lastRead))}catch(e){}}
function markRead(lid){S.lastRead[lid]=now();saveLastRead()}
const me=()=>S.users[S.session];
const U=id=>S.users[id]||{id,name:"Unbekannt",district:"Mitte",role:"giver",paypal:"",bio:"",color:"#8E8E93",ratings:[]};
const LS=id=>S.listings.find(l=>l.id===id);
const ts=s=>new Date(s).getTime();

function mapListing(r,priv){
  const p=priv[r.id];
  return {id:r.id,ownerId:r.owner_id,createdAt:ts(r.created_at),items:{einweg:r.einweg,mehrweg:r.mehrweg,kisten:r.kisten,glas:r.glas},
    glasFee:Number(r.glas_fee),photo:r.photo_url,district:r.district,pos:[r.lat,r.lng],when:fmtWhen(r.when_label),endsAt:(parseWhen(r.when_label)||{}).end||null,handover:r.handover,
    payment:r.payment,note:r.note,status:r.status,collectorId:r.collector_id,ownerRated:r.owner_rated,collectorRated:r.collector_rated,paid:r.paid,
    street:p?p.street:"",exact:p&&p.lat!=null?[p.lat,p.lng]:null};
}
async function q(p){const {data,error}=await p;if(error)throw error;return data||[]}
async function loadAll(){
  const [profiles,listings,priv,messages,ratings]=await Promise.all([
    q(sb.from("profiles").select("*")),q(sb.from("listings").select("*")),q(sb.from("listing_private").select("*")),
    q(sb.from("messages").select("*")),q(sb.from("ratings").select("*"))]);
  const users={};profiles.forEach(p=>users[p.id]={id:p.id,avatar:p.avatar_url||null,name:p.name,district:p.district,role:p.role,paypal:p.paypal,bio:p.bio,color:p.color,ratings:[]});
  ratings.forEach(r=>{if(users[r.to_id])users[r.to_id].ratings.push({from:r.from_id,stars:r.stars,text:r.text,t:ts(r.created_at)})});
  const pv={};priv.forEach(p=>pv[p.listing_id]=p);
  const chats={};messages.slice().sort((a,b)=>ts(a.created_at)-ts(b.created_at)||a.id-b.id).forEach(m=>(chats[m.listing_id]=chats[m.listing_id]||[]).push({from:m.sender_id||"sys",text:m.text,t:ts(m.created_at)}));
  const old=S.loaded?{listings:S.listings,chats:S.chats}:null;
  S.users=users;S.listings=listings.map(r=>mapListing(r,pv)).sort((a,b)=>b.createdAt-a.createdAt);S.chats=chats;S.loaded=true;
  if(old)notifyChanges(old);
}
/* Hinweise bei Änderungen, die andere gemacht haben */
function notifyChanges(old){
  for(const [lid,msgs] of Object.entries(S.chats)){
    const before=(old.chats[lid]||[]).length;
    const fresh=msgs.slice(before).filter(m=>m.from!==S.session&&m.from!=="sys");
    if(fresh.length&&!(view.name==="chat"&&view.id===lid))toast(`${ic(I.chat)} Neue Nachricht von ${esc(U(fresh[fresh.length-1].from).name)}`);
  }
  S.listings.forEach(l=>{const o=old.listings.find(x=>x.id===l.id);if(!o||o.status===l.status)return;
    if(l.ownerId===S.session&&l.status==="angenommen")toast(`${ic(I.check)} ${esc(U(l.collectorId).name)} holt dein Leergut ab`);
    if(l.ownerId===S.session&&l.status==="abgeholt")toast(`${esc(U(l.collectorId).name)} hat dein Leergut abgeholt. Bitte bestätigen.`);
    if(l.collectorId===S.session&&l.status==="abgeschlossen")toast(`${ic(I.check)} ${esc(U(l.ownerId).name)} hat die Abholung bestätigt.`);
  });
}
const ic=svg=>svg.replace('<svg','<svg width="18" height="18"');
let reloadTimer;
function scheduleReload(){clearTimeout(reloadTimer);reloadTimer=setTimeout(async()=>{try{await loadAll();softRender()}catch(e){console.warn(e)}},250)}
let channel=null;
function subscribe(){
  if(channel)return;
  channel=sb.channel("drop-live").on("postgres_changes",{event:"*",schema:"public"},()=>scheduleReload()).subscribe();
}
function unsubscribe(){if(channel){sb.removeChannel(channel);channel=null}}
/* Neu zeichnen, ohne dem Nutzer Eingaben oder Scrollposition wegzunehmen */
function softRender(){
  if(view.name==="new"||document.querySelector(".sheet"))return;
  const a=document.activeElement;if(a&&a.id==="chatin"){const v=a.value;rerenderKeepScroll();const i=$("#chatin");if(i){i.value=v;i.focus()}return}
  if(a&&a.matches("[data-pfield]"))return;
  rerenderKeepScroll();
}
function errText(e){const m=(e&&(e.message||e.error_description))||String(e);
  if(/Invalid login/i.test(m))return"E-Mail oder Passwort stimmt nicht.";
  if(/Email not confirmed/i.test(m))return"Bitte bestätige zuerst deine E-Mail (Link im Postfach).";
  if(/already registered/i.test(m))return"Diese E-Mail ist schon registriert. Bitte anmelden.";
  if(/Password should be/i.test(m))return"Das Passwort muss mindestens 6 Zeichen haben.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return"Keine Verbindung. Bitte prüfe dein Internet.";
  return m}
async function busy(btn,fn){if(btn){if(btn.disabled)return;btn.disabled=true;btn.style.opacity=.6}
  try{await fn()}catch(e){console.error(e);toast(esc(errText(e)))}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.style.opacity=""}}}

/* ---------- Listing helpers ---------- */
function pfandValue(l){const i=l.items;return i.einweg*PRICES.einweg+i.mehrweg*PRICES.mehrweg+i.kisten*PRICES.kisten}
function feeValue(l){return l.items.glas*l.glasFee}
function totalValue(l){return pfandValue(l)+feeValue(l)}
function bottleCount(l){return l.items.einweg+l.items.mehrweg}
function title(l){const i=l.items,p=[];
  if(i.einweg)p.push(`${i.einweg} Einweg`);if(i.mehrweg)p.push(`${i.mehrweg} Mehrweg`);
  if(i.kisten)p.push(`${i.kisten} ${i.kisten===1?"Kiste":"Kisten"}`);if(i.glas)p.push(`${i.glas} ${i.glas===1?"Beutel":"Beutel"} Altglas`);
  return p.join(" · ")||"Leergut"}
function kindIcon(l){const i=l.items;if(i.kisten)return I.crate;if(i.glas&&!bottleCount(l))return I.glass;return I.bottles}
function thumb(l){return l.photo?`<img src="${l.photo}" alt="Foto vom Leergut">`:kindIcon(l)}
function myPos(){return ui.myLoc||DISTRICTS[me().district]||DISTRICTS.Mitte}
function avgRating(u){if(!u.ratings.length)return null;return u.ratings.reduce((a,r)=>a+r.stars,0)/u.ratings.length}
function ratingLine(u){const a=avgRating(u);return a?`<span class="stars" aria-label="${a.toFixed(1)} von 5 Sternen">${stars(a)}</span> <span class="small muted num">${a.toLocaleString("de-DE",{maximumFractionDigits:1})} (${u.ratings.length})</span>`:`<span class="small muted">Noch keine Bewertungen</span>`}
function pill(st){return `<span class="pill st-${st}">${STEP_LABEL[st]}</span>`}
function unread(lid){const msgs=S.chats[lid]||[];const lr=S.lastRead[lid]||0;return msgs.filter(m=>m.t>lr&&m.from!==S.session&&m.from!=="sys").length}
function myChats(){return S.listings.filter(l=>l.collectorId&&(l.ownerId===S.session||l.collectorId===S.session))}
function totalUnread(){return myChats().reduce((a,l)=>a+unread(l.id),0)}

/* ---------- View state ---------- */
let view={name:"home"};
let ui={exploreMode:"list",filter:"alle",mapSel:null,draft:null};
function go(name,extra={}){view=Object.assign({name},extra);render();window.scrollTo(0,0)}

/* ---------- Toast & Sheet ---------- */
let toastTimer;
function toast(msg){const old=$(".toast");if(old)old.remove();const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.innerHTML=msg;document.body.appendChild(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),3600)}
function sheet(html){$("#layer").innerHTML=`<div class="scrim" data-action="close-sheet"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`}
function closeSheet(){$("#layer").innerHTML=""}

/* ---------- Render: Login ---------- */
let loginMode="login",loginErr="",loginInfo="",regRole="giver",lf={name:"",email:"",district:"Mitte"};
function renderLogin(){
  return `<div class="login">
    <div class="brand"><div class="mark">${I.logo}</div><h1>Drop</h1><p>Dein Leergut wird abgeholt. Sammler in deiner Nähe bekommen das Pfand.</p></div>
    <div class="seg" role="group" aria-label="Anmelden oder registrieren">
      <button data-action="login-mode" data-v="login" aria-pressed="${loginMode==="login"}">Anmelden</button>
      <button data-action="login-mode" data-v="register" aria-pressed="${loginMode==="register"}">Registrieren</button>
    </div>
    <form id="authform" class="stack" novalidate>
      ${loginMode==="register"?`
        <label class="f" for="r-name">Name<input class="input" id="r-name" name="name" autocomplete="name" placeholder="z. B. Max Muster" value="${esc(lf.name)}" required></label>`:""}
      <label class="f" for="r-email">E-Mail<input class="input" id="r-email" name="email" type="email" autocomplete="email" autocapitalize="off" placeholder="du@beispiel.de" value="${esc(lf.email)}" required></label>
      <label class="f" for="r-pw">Passwort<input class="input" id="r-pw" name="pw" type="password" autocomplete="${loginMode==="register"?"new-password":"current-password"}" placeholder="mind. 6 Zeichen" required></label>
      ${loginMode==="register"?`
        <label class="f" for="r-district">Stadtteil in Stuttgart<select class="input" id="r-district" name="district">${Object.keys(DISTRICTS).map(d=>`<option ${d===lf.district?"selected":""}>${d}</option>`).join("")}</select></label>
        <div class="f"><span>Ich möchte vor allem …</span>
          <div class="choice" role="group">
            <button type="button" data-action="reg-role" data-v="giver" aria-pressed="${regRole==="giver"}">Leergut abgeben<small>Ich lasse abholen</small></button>
            <button type="button" data-action="reg-role" data-v="collector" aria-pressed="${regRole==="collector"}">Sammeln<small>Ich hole ab und verdiene</small></button>
          </div></div>`:""}
      ${loginErr?`<div class="err" role="alert">${esc(loginErr)}</div>`:""}
      ${loginInfo?`<div class="card small" role="status" style="background:var(--brand-soft)">${esc(loginInfo)}</div>`:""}
      <button class="btn block" type="submit" id="authbtn">${loginMode==="login"?"Anmelden":"Konto erstellen"}</button>
    </form>
    <a class="maplink" href="demo.html" style="background:var(--bg)"><span class="mi" style="background:var(--brand)">${I.compass}</span><span><b>Erst mal ansehen?</b><br><span class="tiny muted">Demo mit Beispieldaten, ohne Konto</span></span><span class="chev">${I.chev}</span></a>
    <div class="demo-banner">${ic(I.info)}<span>Uni-Prototyp für Stuttgart. Mit der Anmeldung stimmst du zu, dass Name, Stadtteil und deine Anfragen für andere Nutzer sichtbar sind.</span></div>
  </div>`;
}
function renderLoading(){return `<div class="login" style="justify-content:center;align-items:center"><div class="brand" style="align-items:center"><div class="mark">${I.logo}</div><p>Lädt …</p></div></div>`}

/* ---------- Render: Listing card ---------- */
function lcard(l,opts={}){
  const d=km(myPos(),l.pos);
  const own=l.ownerId===S.session;
  const showSt=opts.status||own||l.collectorId===S.session;
  return `<button class="lcard" data-action="open" data-id="${l.id}">
    <span class="thumb">${thumb(l)}</span>
    <span style="min-width:0">
      <span class="t">${esc(title(l))}</span>
      <span class="m">${esc(l.district)} · ${fmtKm(d)} · ${esc(l.when)}</span>
      ${showSt?`<span class="s">${pill(l.status)}</span>`:`<span class="m">${esc(U(l.ownerId).name)}</span>`}
    </span>
    <span class="getpill">${eur(totalValue(l))}</span></button>`;
}
function group(ls,opts){return `<div class="group">${ls.map(l=>lcard(l,opts)).join("")}</div>`}

/* ---------- Render: Home ---------- */
function renderHome(){
  const u=me();
  const role=u.role;
  const today=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  const hi=`<div class="stack" style="gap:14px"><div class="topbar"><div><div class="eyebrow">${today}</div><h1>${role==="giver"?"Abgeben":"Sammeln"}</h1></div>
      <button class="iconbtn" style="width:40px;height:40px;padding:0;overflow:hidden" data-action="nav" data-v="profile" aria-label="Profil">${avatar(u)}</button></div>

/* ---------- Echte Karte (Leaflet + OpenStreetMap) ---------- */
const TILE_URL="https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const TILE_ATTR='© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende';
let maps=[];
function clearMaps(){maps.forEach(m=>{try{m.off();m.stop();m.remove()}catch(e){}});maps=[]}
function baseMap(el,center,zoom,opts={}){
  const m=L.map(el,Object.assign({zoomControl:false,attributionControl:true,fadeAnimation:false},opts)).setView(center,zoom);
  L.tileLayer(TILE_URL,{attribution:TILE_ATTR,maxZoom:19,className:"osm-tiles"}).addTo(m);
  m.attributionControl.setPrefix(false);maps.push(m);return m;
}
function pinIcon(l,sel){const fee=feeValue(l)>0;return L.divIcon({className:"pinwrap",html:`<span class="pinb${fee?"":" w"}${sel?" sel":""}">${eur(totalValue(l)).replace(/,00/,"")}</span>`,iconSize:null})}
function renderMap(ls){
  const sel=ui.mapSel&&ls.find(l=>l.id===ui.mapSel);
  return `<div class="mapbox"><div id="lmap" class="lmap" role="region" aria-label="Karte mit ${ls.length} Abholorten"></div>

  <div id="mapcard">${sel?lcard(sel):`<div class="tiny muted" style="padding:0 4px">Tippe auf einen Preis, um die Anfrage zu sehen. Die Pins zeigen den ungefähren Ort, die genaue Adresse siehst du nach dem Annehmen.</div>`}</div>

}
function initExploreMap(ls){
  const el=$("#lmap");if(!el||!window.L)return;
  const m=baseMap(el,ui.mapView?ui.mapView.c:myPos(),ui.mapView?ui.mapView.z:12);
  L.control.zoom({position:"topright"}).addTo(m);
  L.circleMarker(myPos(),{radius:7,color:"#fff",weight:3,fillColor:"#0A84FF",fillOpacity:1}).addTo(m).bindTooltip(ui.myLoc?"Dein Standort":"Dein Stadtteil");
  const markers={};
  ls.forEach(l=>{markers[l.id]=L.marker(l.pos,{icon:pinIcon(l,ui.mapSel===l.id),keyboard:true,title:title(l)}).addTo(m).on("click",()=>{
    const prev=ui.mapSel;ui.mapSel=l.id;
    if(prev&&markers[prev]){const p=LS(prev);p&&markers[prev].setIcon(pinIcon(p,false))}
    markers[l.id].setIcon(pinIcon(l,true));$("#mapcard").innerHTML=lcard(l);
  })});
  if(!ui.mapView&&ls.length){m.fitBounds(L.latLngBounds([myPos(),...ls.map(l=>l.pos)]).pad(.15),{maxZoom:15,animate:false})}
  m.on("moveend",()=>{const c=m.getCenter();ui.mapView={c:[c.lat,c.lng],z:m.getZoom()}});
}
function initDetailMap(l,exactVisible){
  const el=$("#dmap");if(!el||!window.L)return;
  const p=exactVisible&&l.exact?l.exact:l.pos;
  const m=baseMap(el,p,exactVisible&&l.exact?16:14,{dragging:!L.Browser.mobile,scrollWheelZoom:false,tap:false});
  if(exactVisible&&l.exact)L.marker(p,{icon:L.divIcon({className:"pinwrap",html:`<span class="pinb">${esc(l.street||"Hier")}</span>`,iconSize:null})}).addTo(m);
  else L.circle(p,{radius:450,color:"#1E9E4A",weight:2,fillColor:"#1E9E4A",fillOpacity:.12}).addTo(m);
}
function afterRender(){

  if(view.name==="explore"&&ui.exploreMode==="map")initExploreMap(filtered());

/* Adresse in Koordinaten umwandeln (OpenStreetMap Nominatim) */
async function geocode(street,district){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),6000);
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=${encodeURIComponent(street+", "+district+", Stuttgart")}`,{signal:ctl.signal,headers:{"Accept-Language":"de"}});
    const j=await r.json();if(j[0])return [Number(j[0].lat),Number(j[0].lon)];
  }catch(e){}finally{clearTimeout(t)}
  return null;
}
function fuzz(p,m=250){const dLat=(Math.random()-.5)*2*m/111000,dLng=(Math.random()-.5)*2*m/(111000*Math.cos(p[0]*Math.PI/180));return [p[0]+dLat,p[1]+dLng]}

/* ---------- Zeitfenster ---------- */
const TIMES=[];for(let h=6;h<=22;h++){TIMES.push(String(h).padStart(2,"0")+":00");if(h<22)TIMES.push(String(h).padStart(2,"0")+":30")}
function dayDate(i){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);return d}
function isoDay(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function relDay(d){const t=dayDate(0),diff=Math.round((d-t)/DAY);
  if(diff===0)return"Heute";if(diff===1)return"Morgen";
  return d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"numeric"}).replace(/\.$/,".")}
function chipDay(i){const d=dayDate(i);return i<2?relDay(d):d.toLocaleDateString("de-DE",{weekday:"short"})+" "+d.getDate()+"."}
/* Gespeichert wird "2026-11-24|17:00|20:00", angezeigt wird "Morgen, 17:00–20:00 Uhr" */
function parseWhen(s){const m=/^(\d{4})-(\d{2})-(\d{2})\|(\d{2}:\d{2})\|(\d{2}:\d{2})$/.exec(s||"");if(!m)return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);const [eh,em]=m[5].split(":").map(Number);const end=new Date(d);end.setHours(eh,em,0,0);return {d,from:m[4],to:m[5],end:end.getTime()}}
function fmtWhen(s){const p=parseWhen(s);return p?`${relDay(p.d)}, ${p.from}–${p.to} Uhr`:(s||"")}
function whenKey(d){return `${isoDay(dayDate(d.day))}|${d.from}|${d.to}`}
function defaultSlot(){const n=new Date();let mins=Math.ceil((n.getHours()*60+n.getMinutes()+30)/30)*30;mins=Math.max(mins,8*60);
  if(mins>20*60)return {day:1,from:"17:00",to:"20:00"};
  const f=Math.min(mins,21*60),t=Math.min(f+180,22*60),hm=x=>String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");
  return {day:0,from:hm(f),to:hm(t)}}
function slotError(d){if(d.to<=d.from)return"Das Ende muss nach dem Beginn liegen.";
  if(d.day===0){const n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");if(d.to<=hm)return"Dieses Zeitfenster ist heute schon vorbei."}
  return""}
function whenPicker(d){
  const err=slotError(d);
  return `<div class="f"><span>Tag</span><div class="chips" role="group" aria-label="Tag">${[0,1,2,3,4,5,6].map(i=>`<button type="button" class="chip" data-action="day" data-v="${i}" aria-pressed="${d.day===i}">${chipDay(i)}</button>`).join("")}</div></div>
    <div class="row" style="gap:10px;align-items:flex-end">
      <label class="f" for="n-from" style="flex:1">Von<select class="input" id="n-from" data-field="from">${TIMES.slice(0,-1).map(t=>`<option ${t===d.from?"selected":""}>${t}</option>`).join("")}</select></label>
      <span style="padding-bottom:14px" class="muted">–</span>
      <label class="f" for="n-to" style="flex:1">Bis<select class="input" id="n-to" data-field="to">${TIMES.slice(1).map(t=>`<option ${t===d.to?"selected":""} ${t<=d.from?"disabled":""}>${t}</option>`).join("")}</select></label>
    </div>
    <div class="${err?"err":"tiny muted"}" id="slot-msg">${err?esc(err):`Abholung: <b>${esc(fmtWhen(whenKey(d)))}</b>`}</div>`;
}

function locate(btn){
  if(!navigator.geolocation){toast("Standort wird von diesem Gerät nicht unterstützt.");return}
  btn.style.opacity=.5;
  navigator.geolocation.getCurrentPosition(p=>{ui.myLoc=[p.coords.latitude,p.coords.longitude];ui.mapView={c:ui.myLoc,z:14};btn.style.opacity="";render();toast("Entfernungen jetzt ab deinem Standort")},
    ()=>{btn.style.opacity="";toast("Standort nicht freigegeben. Wir nutzen deinen Stadtteil.")},{enableHighAccuracy:false,timeout:8000});
}

function captureDraft(){const d=ui.draft;if(!d)return;document.querySelectorAll("[data-field]").forEach(i=>d[i.dataset.field]=i.value)}
document.addEventListener("input",e=>{if(e.target.dataset.field&&ui.draft)ui.draft[e.target.dataset.field]=e.target.value});
document.addEventListener("change",e=>{
  if((e.target.id==="n-from"||e.target.id==="n-to")&&ui.draft){captureDraft();const d=ui.draft;
    if(d.to<=d.from){const i=TIMES.indexOf(d.from);d.to=TIMES[Math.min(i+4,TIMES.length-1)]}
    rerenderKeepScroll();return}
  if(e.target.id==="avatar-in"&&e.target.files[0])uploadAvatar(e.target.files[0]);
  if(e.target.id==="photo"&&e.target.files[0]){captureDraft();compress(e.target.files[0]).then(({url,blob})=>{ui.draft.photo=url;ui.draft.photoBlob=blob;rerenderKeepScroll()}).catch(()=>toast("Foto konnte nicht geladen werden."))}
  if(e.target.dataset.field&&ui.draft)ui.draft[e.target.dataset.field]=e.target.value;
});
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const m=1080,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);const url=c.toDataURL("image/jpeg",.75);c.toBlob(b=>b?res({url,blob:b}):rej(new Error("blob")),"image/jpeg",.75)};img.src=r.result};r.readAsDataURL(file)})}

/* Profilbild: quadratisch zuschneiden, verkleinern, hochladen */
function squareJpeg(file,size=400){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2,c=document.createElement("canvas");c.width=c.height=size;
  c.getContext("2d").drawImage(img,sx,sy,m,m,0,0,size,size);c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",.82)};img.src=r.result};r.readAsDataURL(file)})}
async function uploadAvatar(file){
  const box=$("#avedit");box&&box.classList.add("busy");
  try{
    const blob=await squareJpeg(file);const path=`${S.session}/avatar-${Date.now()}.jpg`;
    const {error}=await sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg",upsert:false});if(error)throw error;
    const url=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
    await q(sb.from("profiles").update({avatar_url:url}).eq("id",S.session));await refresh();toast(`${ic(I.check)} Profilbild gespeichert`);
  }catch(e){console.error(e);toast(esc(/avatar_url/.test(e.message||"")?"Profilbilder sind in der Datenbank noch nicht eingerichtet.":errText(e)))}
  finally{const b=$("#avedit");b&&b.classList.remove("busy")}
}
async function publish(){
  captureDraft();const d=ui.draft;
  if(!(d.items.einweg||d.items.mehrweg||d.items.kisten||d.items.glas)){ui.newErr="Bitte gib an, was abgeholt werden soll.";rerenderKeepScroll();return}
  if(!d.street.trim()){ui.newErr="Bitte gib Straße und Hausnummer an.";rerenderKeepScroll();$("#n-street")?.focus();return}
  if(slotError(d)){ui.newErr=slotError(d);rerenderKeepScroll();return}
  ui.newErr="";
  const id=crypto.randomUUID();
  let photo_url=null;
  if(d.photoBlob){
    const path=`${S.session}/${id}.jpg`;
    const {error}=await sb.storage.from("photos").upload(path,d.photoBlob,{contentType:"image/jpeg",upsert:false});
    if(error)throw error;
    photo_url=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
  }
  const exact=await geocode(d.street.trim(),d.district);
  const pub=exact?fuzz(exact,250):fuzz(DISTRICTS[d.district],500);
  await q(sb.from("listings").insert({id,owner_id:S.session,einweg:d.items.einweg,mehrweg:d.items.mehrweg,kisten:d.items.kisten,glas:d.items.glas,
    glas_fee:d.items.glas?d.glasFee:0,photo_url,district:d.district,lat:pub[0],lng:pub[1],when_label:whenKey(d),handover:d.handover,payment:d.payment,note:d.note.trim()}));
  await q(sb.from("listing_private").insert({listing_id:id,street:d.street.trim(),lat:exact?exact[0]:null,lng:exact?exact[1]:null}));
  ui.draft=null;await loadAll();
  toast(`${ic(I.check)} Anfrage veröffentlicht. Sammler in der Nähe sehen sie jetzt.`);
  go("detail",{id,from:{name:"home"}});
}

      if(loginMode==="login"){
        const {error}=await sb.auth.signInWithPassword({email,password:pw});
        if(error){loginErr=errText(error);render()}
      }else{
        const name=String(f.get("name")||"").trim();
        if(!name||!email.includes("@")||pw.length<6){loginErr="Bitte Name, gültige E-Mail und ein Passwort mit mindestens 6 Zeichen angeben.";render();return}
        const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name,district:String(f.get("district")),role:regRole},emailRedirectTo:location.origin+location.pathname}});
        if(error){loginErr=errText(error);render();return}
        if(!data.session){loginMode="login";loginInfo="Fast geschafft! Wir haben dir eine E-Mail geschickt. Bitte bestätige den Link und melde dich dann hier an.";render()}
        else toast(`Willkommen bei Drop, ${esc(name.split(" ")[0])}!`);
      }
    });
  }
});

/* ---------- Start ---------- */
let booted=false;
async function startSession(session){
  S.session=session.user.id;
  try{
    await loadAll();
    if(!S.users[S.session]){ // Profil fehlt (z. B. vor dem Datenbank-Setup registriert)
      const md=session.user.user_metadata||{};
      await q(sb.from("profiles").insert({id:S.session,name:md.name||session.user.email.split("@")[0],district:md.district||"Mitte",role:md.role==="collector"?"collector":"giver"}));
      await loadAll();
    }
    subscribe();
    if(!booted){booted=true;view={name:"home"}}
    render();
  }catch(e){console.error(e);$("#app").innerHTML=`<div class="login"><h2>Verbindung fehlgeschlagen</h2><p class="muted">${esc(errText(e))}</p><button class="btn" onclick="location.reload()">Neu laden</button></div>`}
}
sb.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT"||!session){S.session=null;S.loaded=false;booted=false;unsubscribe();clearMaps();loginMode="login";render();return}
  if((event==="SIGNED_IN"||event==="INITIAL_SESSION")&&session.user.id!==S.session)setTimeout(()=>startSession(session),0);
});
$("#app").innerHTML=renderLoading();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.session)scheduleReload()});

</script>
